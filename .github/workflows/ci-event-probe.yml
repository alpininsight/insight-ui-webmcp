name: CI event probe

on:
  pull_request:
    branches: [develop]
    types: [opened, reopened, synchronize]
  push:
    branches: [chore/retain-release-version]

permissions: {}

jobs:
  event-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the delivered event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: printf 'Received %s\n' "$EVENT_NAME"
